<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D1117;
  --surface: #161B22;
  --card: #1C2230;
  --border: rgba(255,255,255,0.08);
  --gold: #F0C040;
  --gold2: #E8A020;
  --teal: #4ECDC4;
  --rose: #FF6B6B;
  --sky: #74B9FF;
  --text: #E8DCC8;
  --muted: #8892A4;
  --white: #F5F0E8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Stars background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(240,192,64,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 10%, rgba(116,185,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 25%, rgba(240,192,64,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 70%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 92% 45%, rgba(116,185,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 50% 85%, rgba(240,192,64,0.3) 0%, transparent 100%),
    radial-gradient(2px 2px at 35% 55%, rgba(255,255,255,0.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 68% 12%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 5%  50%, rgba(116,185,255,0.3) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* Glow blobs */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 600px 400px at 20% 30%, rgba(240,192,64,0.05) 0%, transparent 70%),
    radial-gradient(ellipse 500px 300px at 80% 70%, rgba(78,205,196,0.05) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ===== LAYOUT ===== */
.container {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

/* ===== HEADER ===== */
header {
  text-align: center;
  padding: 56px 0 40px;
}

.logo-icon {
  font-size: 2.8rem;
  display: block;
  margin-bottom: 16px;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.2rem, 6vw, 3.2rem);
  font-weight: 700;
  color: var(--white);
  line-height: 1.1;
  margin-bottom: 12px;
}

header h1 em {
  color: var(--gold);
  font-style: italic;
}

header p {
  font-size: 0.95rem;
  color: var(--muted);
  font-weight: 300;
}

/* ===== PROGRESS ===== */
.progress-track {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 32px;
  padding: 0 4px;
}

.progress-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--border);
  border: 1px solid rgba(255,255,255,0.15);
  transition: all 0.3s;
  flex-shrink: 0;
}

.progress-dot.done {
  background: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 8px rgba(240,192,64,0.5);
}

.progress-dot.active {
  background: transparent;
  border-color: var(--gold);
  box-shadow: 0 0 10px rgba(240,192,64,0.4);
  animation: pulse-dot 1.5s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%,100% { box-shadow: 0 0 6px rgba(240,192,64,0.4); }
  50% { box-shadow: 0 0 14px rgba(240,192,64,0.8); }
}

.progress-line {
  flex: 1;
  height: 1px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}

.progress-line::after {
  content: '';
  position: absolute;
  left: 0; top: 0;
  height: 100%;
  background: var(--gold);
  width: 0%;
  transition: width 0.5s ease;
}

.progress-line.filled::after { width: 100%; }

/* ===== QUESTION CARD ===== */
.q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.03),
    0 24px 60px rgba(0,0,0,0.5);
  animation: cardIn 0.35s ease both;
}

@keyframes cardIn {
  from { opacity:0; transform: scale(0.94) translateY(16px); }
  to   { opacity:1; transform: scale(1) translateY(0); }
}

.q-header {
  padding: 28px 32px 24px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(240,192,64,0.04), rgba(78,205,196,0.04));
}

.q-step-label {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.q-step-label::before {
  content: '';
  width: 20px;
  height: 1px;
  background: var(--gold);
}

.q-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.65rem;
  font-weight: 600;
  color: var(--white);
  line-height: 1.25;
}

.q-sub {
  margin-top: 6px;
  font-size: 0.84rem;
  color: var(--muted);
  font-weight: 300;
}

/* ===== OPTIONS ===== */
.q-options {
  padding: 24px 32px 32px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opt-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all 0.2s;
  font-family: 'Outfit', sans-serif;
  color: var(--text);
  width: 100%;
  position: relative;
  overflow: hidden;
}

.opt-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(240,192,64,0.06), transparent);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}

.opt-btn:hover {
  border-color: rgba(240,192,64,0.4);
  transform: translateX(4px);
  background: rgba(240,192,64,0.04);
}

.opt-btn:hover::before { opacity: 1; }

.opt-btn:active { transform: translateX(2px) scale(0.99); }

.opt-icon {
  font-size: 1.6rem;
  flex-shrink: 0;
  width: 36px;
  text-align: center;
}

.opt-text { flex: 1; }

.opt-label {
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--white);
  display: block;
  margin-bottom: 2px;
}

.opt-desc {
  font-size: 0.78rem;
  color: var(--muted);
  font-weight: 300;
  display: block;
}

.opt-arrow {
  color: var(--muted);
  font-size: 0.9rem;
  transition: transform 0.2s, color 0.2s;
}

.opt-btn:hover .opt-arrow {
  transform: translateX(4px);
  color: var(--gold);
}

/* Back button */
.q-footer {
  padding: 0 32px 28px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-back {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'Outfit', sans-serif;
  font-size: 0.82rem;
  padding: 8px 16px;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-back:hover {
  border-color: var(--muted);
  color: var(--white);
}

.q-path {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.2);
  flex: 1;
  text-align: right;
  font-style: italic;
}

/* ===== RESULT CARD ===== */
.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}

.result-hero {
  padding: 36px 32px 28px;
  background: linear-gradient(135deg,
    rgba(240,192,64,0.08) 0%,
    rgba(78,205,196,0.05) 50%,
    rgba(116,185,255,0.05) 100%);
  border-bottom: 1px solid var(--border);
  text-align: center;
}

.result-badge {
  display: inline-block;
  background: rgba(240,192,64,0.12);
  border: 1px solid rgba(240,192,64,0.3);
  color: var(--gold);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 5px 14px;
  border-radius: 100px;
  margin-bottom: 18px;
}

.result-emoji {
  font-size: 4rem;
  display: block;
  margin-bottom: 14px;
  animation: float 3s ease-in-out infinite;
}

.result-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 6px;
  line-height: 1.1;
}

.result-subtitle {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
  color: var(--gold);
  margin-bottom: 12px;
}

.result-desc {
  font-size: 0.9rem;
  color: var(--muted);
  line-height: 1.7;
  max-width: 480px;
  margin: 0 auto;
  font-weight: 300;
}

/* Info grid */
.result-grid {
  padding: 24px 32px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  border-bottom: 1px solid var(--border);
}

.info-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  opacity: 0;
  transform: translateY(10px);
  animation: itemIn 0.4s ease forwards;
}

.info-item:nth-child(1) { animation-delay: 0.1s; }
.info-item:nth-child(2) { animation-delay: 0.2s; }
.info-item:nth-child(3) { animation-delay: 0.3s; }
.info-item:nth-child(4) { animation-delay: 0.4s; }

@keyframes itemIn {
  to { opacity:1; transform: translateY(0); }
}

.info-icon { font-size: 1.2rem; margin-bottom: 6px; display: block; }
.info-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 500; margin-bottom: 3px; display: block; }
.info-value { font-size: 0.9rem; color: var(--white); font-weight: 500; }

/* Tips */
.result-tips {
  padding: 24px 32px;
  border-bottom: 1px solid var(--border);
}

.tips-title {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tips-title::before { content:''; width:16px; height:1px; background: var(--teal); }

.tip-item {
  display: flex;
  gap: 12px;
  margin-bottom: 10px;
  font-size: 0.86rem;
  color: var(--text);
  line-height: 1.5;
  font-weight: 300;
  opacity: 0;
  animation: itemIn 0.4s ease forwards;
}

.tip-item:nth-child(2) { animation-delay: 0.5s; }
.tip-item:nth-child(3) { animation-delay: 0.6s; }
.tip-item:nth-child(4) { animation-delay: 0.7s; }

.tip-dot {
  width: 6px;
  height: 6px;
  background: var(--teal);
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 7px;
}

/* Alternatives */
.result-alts {
  padding: 20px 32px 28px;
}

.alts-title {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--sky);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.alts-title::before { content:''; width:16px; height:1px; background: var(--sky); }

.alts-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
}

.alt-chip {
  background: rgba(116,185,255,0.08);
  border: 1px solid rgba(116,185,255,0.2);
  color: var(--sky);
  font-size: 0.82rem;
  padding: 6px 14px;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.2s;
}

.alt-chip:hover {
  background: rgba(116,185,255,0.15);
  transform: translateY(-2px);
}

.btn-restart {
  width: 100%;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: #1A1000;
  border: none;
  font-family: 'Outfit', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}

.btn-restart:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(240,192,64,0.35);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 500px) {
  .q-header, .q-options { padding-left: 20px; padding-right: 20px; }
  .q-footer { padding: 0 20px 24px; }
  .result-grid { grid-template-columns: 1fr 1fr; }
  .result-hero, .result-grid, .result-tips, .result-alts { padding-left: 20px; padding-right: 20px; }
}
</style>
</head>

// ============================================================
// STATE
// ============================================================
let history = []; // stack of nodes
let currentNode = tree;
let totalSteps = 0;
let currentStep = 0;

function countDepth(node) {
  if (node.result) return 1;
  if (!node.options) return 1;
  return 1 + Math.max(...node.options.map(o => countDepth(o.next || { result: true })));
}

// ============================================================
// RENDER
// ============================================================
function buildProgressTrack() {
  const track = document.getElementById('progressTrack');
  track.innerHTML = '';
  const maxSteps = 5;
  for (let i = 0; i < maxSteps; i++) {
    if (i > 0) {
      const line = document.createElement('div');
      line.className = 'progress-line' + (i <= currentStep ? ' filled' : '');
      track.appendChild(line);
    }
    const dot = document.createElement('div');
    dot.className = 'progress-dot' + (i < currentStep ? ' done' : i === currentStep ? ' active' : '');
    track.appendChild(dot);
  }
}

function renderQuestion(node) {
  buildProgressTrack();
  const area = document.getElementById('quizArea');
  area.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'q-card';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'q-header';
  hdr.innerHTML = `
    <div class="q-step-label">${node.stepLabel || 'Savol'}</div>
    <div class="q-title">${node.question}</div>
    ${node.sub ? `<div class="q-sub">${node.sub}</div>` : ''}
  `;
  card.appendChild(hdr);

  // Options
  const opts = document.createElement('div');
  opts.className = 'q-options';

  node.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `
      <span class="opt-icon">${opt.icon}</span>
      <span class="opt-text">
        <span class="opt-label">${opt.label}</span>
        ${opt.desc ? `<span class="opt-desc">${opt.desc}</span>` : ''}
      </span>
      <span class="opt-arrow">›</span>
    `;
    btn.onclick = function() { choose(opt); };
    opts.appendChild(btn);
  });

  card.appendChild(opts);

  // Footer
  if (history.length > 0) {
    const footer = document.createElement('div');
    footer.className = 'q-footer';
    footer.innerHTML = `<button class="btn-back" onclick="goBack()">← Orqaga</button>`;
    card.appendChild(footer);
  }

  area.appendChild(card);
}

function choose(opt) {
  history.push(currentNode);
  currentStep = Math.min(currentStep + 1, 4);

  if (opt.result) {
    renderResult(opt.result);
  } else if (opt.next) {
    currentNode = opt.next;
    renderQuestion(currentNode);
  } else {
    // fallback — should never happen
    renderResult('uzbekistan_silk');
  }
}

function goBack() {
  if (history.length === 0) return;
  currentNode = history.pop();
  currentStep = Math.max(currentStep - 1, 0);
  renderQuestion(currentNode);
}

// ============================================================
// RESULT
// ============================================================
function renderResult(key) {
  buildProgressTrack();
  const r = results[key];
  if (!r) {
    document.getElementById('quizArea').innerHTML = '<p style="color:red">Natija topilmadi: ' + key + '</p>';
    return;
  }

  const area = document.getElementById('quizArea');
  area.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'result-card';

  card.innerHTML = `
    <div class="result-hero">
      <div class="result-badge">✦ Sizga mos joy topildi</div>
      <span class="result-emoji">${r.emoji}</span>
      <div class="result-title">${r.name}</div>
      <div class="result-subtitle">${r.subtitle}</div>
      <div class="result-desc">${r.desc}</div>
    </div>

    <div class="result-grid">
      <div class="info-item">
        <span class="info-icon">📅</span>
        <span class="info-label">Eng yaxshi mavsum</span>
        <span class="info-value">${r.info.season}</span>
      </div>
      <div class="info-item">
        <span class="info-icon">💰</span>
        <span class="info-label">Byudjet</span>
        <span class="info-value">${r.info.budget}</span>
      </div>
      <div class="info-item">
        <span class="info-icon">🏨</span>
        <span class="info-label">Tavsiya qilinadigan muddat</span>
        <span class="info-value">${r.info.stay}</span>
      </div>
      <div class="info-item">
        <span class="info-icon">🛂</span>
        <span class="info-label">Viza</span>
        <span class="info-value">${r.info.visa}</span>
      </div>
    </div>

    <div class="result-tips">
      <div class="tips-title">Muhim maslahatlar</div>
      ${r.tips.map(t => `<div class="tip-item"><div class="tip-dot"></div>${t}</div>`).join('')}
    </div>

    <div class="result-alts">
      <div class="alts-title">Muqobil variantlar</div>
      <div class="alts-row">
        ${r.alts.map(a => `<span class="alt-chip">${a}</span>`).join('')}
      </div>
      <button class="btn-restart" onclick="restart()">↺ Qaytadan boshlash</button>
    </div>
  `;

  area.appendChild(card);
}

function restart() {
  history = [];
  currentNode = tree;
  currentStep = 0;
  renderQuestion(currentNode);
}

// ============================================================
// INIT
// ============================================================
renderQuestion(currentNode);
</script>
